name: build

on:
  push:
    # o agente do PC muda sozinho: mudança só nele não gera APK novo (e não cancela um build que está rodando)
    paths-ignore: ['tools/pc/**']
  pull_request:
  workflow_dispatch:

# um push novo cancela o build anterior do mesmo branch: senão um build velho que termina depois troca o APK da release
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # um runner travado gastava até 6 h da cota de minutos
    permissions:
      contents: write  # para publicar o APK na página de releases
    steps:
      - uses: actions/checkout@v7


      - name: Testa o daemon
        run: sudo tests/daemon_test.sh

      # arm64 para o celular; x86_64 para o emulador do PC (Android Studio), onde rodam os testes automáticos
      - name: Compila o daemon e o jogo de teste (arm64 e x86_64)
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for abi in arm64-v8a:aarch64 x86_64:x86_64; do
            dir=app/src/main/jniLibs/${abi%%:*}; cc="$bin/${abi##*:}-linux-android26-clang"
            mkdir -p "$dir"
            "$cc" -O2 -Wall -Werror -pthread -o "$dir/libtinkerd.so" daemon/tinkerd.c -lm
            # jogo de teste: o mesmo alvo do teste do daemon, para o autoteste usar no lugar de um jogo
            "$cc" -O2 -pthread -o "$dir/libtinkertarget.so" tests/target.c
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          # bibliotecas ficam em cache: o build não depende dos servidores estarem no ar
          cache: gradle

      - name: Gera o APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease  # sem o APK de depuração: metade dos minutos

      - uses: actions/upload-artifact@v7
        with:
          name: tinker-apk
          path: app/build/outputs/apk/release/app-release.apk

      # página fixa de download: uma release por versão (versionName), atualizada a cada push
      - name: Publica na página de releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "Tinker-$v.apk"
          cp testgame/build/outputs/apk/release/testgame-release.apk JogoTeste.apk
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" "Tinker-$v.apk" JogoTeste.apk --clobber
          else
            gh release create "v$v" "Tinker-$v.apk" JogoTeste.apk --target "$GITHUB_SHA" --title "Tinker $v" \
              --notes "APK do Tinker $v (arm64). Instala por cima da versão anterior, sem perder os salvos."
          fi
