name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # para publicar o APK na página de releases
    steps:
      - uses: actions/checkout@v7


      - name: Testa o daemon
        run: sudo tests/daemon_test.sh

      - name: Compila o daemon (arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" \
            -O2 -Wall -Werror -pthread -o app/src/main/jniLibs/arm64-v8a/libtinkerd.so daemon/tinkerd.c -lm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          # bibliotecas ficam em cache: o build não depende dos servidores estarem no ar
          cache: gradle

      - name: Gera o APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: tinker-apk
          path: app/build/outputs/apk/release/app-release.apk

      # versão de depuração, maior, só para investigar problemas da versão otimizada
      - uses: actions/upload-artifact@v7
        with:
          name: tinker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # página fixa de download: uma release por versão (versionName), atualizada a cada push
      - name: Publica na página de releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "Tinker-$v.apk"
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" "Tinker-$v.apk" --clobber
          else
            gh release create "v$v" "Tinker-$v.apk" --target "$GITHUB_SHA" --title "Tinker $v" \
              --notes "APK do Tinker $v (arm64). Instala por cima da versão anterior, sem perder os salvos."
          fi
