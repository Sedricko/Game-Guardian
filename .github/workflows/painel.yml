name: painel

# PainelTinker.exe (Windows): o painel e o agente do PC num arquivo so, na release "painel-pc"
on:
  push:
    paths: ['tools/pc/**', '.github/workflows/painel.yml']
  workflow_dispatch:

concurrency:
  group: painel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Compila o PainelTinker.exe (csc do .NET Framework, que vem no Windows)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $pc = "tools/pc"
          & $csc /nologo /target:winexe /optimize /out:PainelTinker.exe /win32manifest:$pc/exe/app.manifest `
            "/resource:$pc/PAINEL-TINKER.ps1,PAINEL-TINKER.ps1" "/resource:$pc/painel-tinker.html,painel-tinker.html" `
            "/resource:$pc/TINKER-AGENTE.ps1,TINKER-AGENTE.ps1" $pc/exe/PainelTinker.cs
          if ($LASTEXITCODE) { exit 1 }
          # os scripts precisam abrir no PowerShell 5 do Windows: erro de sintaxe aqui para o build
          foreach ($f in "$pc/PAINEL-TINKER.ps1", "$pc/TINKER-AGENTE.ps1") {
            $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e)
            if ($e) { Write-Error "$f linha $($e[0].Extent.StartLineNumber): $($e[0].Message)"; exit 1 }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: PainelTinker
          path: PainelTinker.exe
      - name: Publica na release painel-pc
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view painel-pc *> $null
          if ($LASTEXITCODE) { gh release create painel-pc PainelTinker.exe --target $env:GITHUB_SHA --title "Painel Tinker (PC)" --notes "PainelTinker.exe: o painel e o agente do Orecraft num arquivo so. Baixe e de duplo clique (pede administrador)." }
          else { gh release upload painel-pc PainelTinker.exe --clobber }
